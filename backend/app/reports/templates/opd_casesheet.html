<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page_title }} - {{ patient_no }}</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11pt;
      color: #111827;
      margin: 0;
      padding: 0;
    }
    .header-title {
      font-size: 18pt;
      font-weight: bold;
      color: #1e3a8a;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .header-sub {
      font-size: 13pt;
      font-weight: bold;
      color: #334155;
      text-align: center;
      margin: 6pt 0 0;
      padding: 0;
      letter-spacing: 0.5pt;
    }
    .header-meta {
      font-size: 9pt;
      font-weight: normal;
      color: #64748b;
      text-align: center;
      margin: 2pt 0 0;
      padding: 0;
    }
    .meta-label {
      font-weight: bold;
      color: #334155;
      white-space: nowrap;
      padding: 4pt 10pt 4pt 0;
      vertical-align: top;
      width: 32%;
    }
    .meta-value {
      color: #111827;
      font-size: 11pt;
      padding: 4pt 0;
      vertical-align: top;
    }
  </style>
</head>
<body>
  <table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
      <td width="100%" style="width:100%; text-align:center; padding-bottom: 8pt;">
        {% include "_hospital_header.html" %}
        <p class="header-sub">{{ page_title }}</p>
      </td>
    </tr>
  </table>

  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 10pt;">
    <tr valign="top">
      <td width="48%" style="padding-right: 18pt;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td class="meta-label">Patient ID</td>
            <td class="meta-value">{{ patient_no }}</td>
          </tr>
          <tr>
            <td class="meta-label">Patient Name</td>
            <td class="meta-value">{{ patient_name }}</td>
          </tr>
        </table>
      </td>
      <td width="4%" style="font-size: 0; line-height: 0;">&nbsp;</td>
      <td width="48%" style="padding-left: 6pt;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td class="meta-label">Date</td>
            <td class="meta-value">{{ case_date }}</td>
          </tr>
          <tr>
            <td class="meta-label">Doctor</td>
            <td class="meta-value">{{ doctor_name }}</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 12pt;">
    <tr>
      <td style="border-bottom: 2px solid #1e40af; font-size: 0; line-height: 0;">&nbsp;</td>
    </tr>
  </table>
</body>
</html>
